[project]
name = "memos-ng"
version = "1.6.2"
description = "Memos rebuilt on the household default web stack — FastAPI + async media pipeline"
requires-python = ">=3.13"
dependencies = [
    # Each entry carries an upper bound at the next major of the version uv.lock resolves today, so a
    # rebuild from a stale or regenerated lock cannot silently cross a major-version break. Bounds are
    # a floor-and-ceiling contract, not the pin — uv.lock is the pin. A new entry gets a bound too.
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4,<27",
    "prometheus-fastapi-instrumentator>=7.0,<9",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=44,<51",
    "puremagic>=1.28,<3",
    "pillow>=11,<13",
    "pillow-heif>=0.18,<2",
    "pywebpush>=2.0,<3",
    # --- daily digest (MEMNG-234). memos-ng had no server-side Markdown renderer and no template
    # engine; the digest's mail body is the satellite's Jinja2 template rendering memo Markdown,
    # so all three arrive together and the versions are the satellite's proven ones as a FLOOR
    # (uv.lock is what actually pins; the local gate checks it).
    "jinja2>=3.1.6,<4",
    "markdown>=3.7,<4",
    "bleach>=6.2,<7",
    # Imported DIRECTLY by app/services/digest/metrics.py (CounterMetricFamily, GaugeMetricFamily,
    # REGISTRY). It reached the graph only transitively through prometheus-fastapi-instrumentator
    # until now, and a transitive dependency is not a contract: a future instrumentator release
    # could drop it and this import would break at runtime, not at resolve time.
    "prometheus-client>=0.21,<1",
    # The digest is the first feature whose CORRECTNESS depends on a named IANA zone resolving:
    # `digest_due` converts UTC to the configured zone to decide whether today's run is due, and
    # python:3.13-slim's zone availability rides on whatever the Debian package graph happens to
    # pull. Declaring it makes ZoneInfo("Europe/Zurich") a resolved fact rather than an
    # observation of one image build.
    "tzdata>=2024.2,<2027",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Async service tests legitimately make blocking filesystem assertions (the event loop is the
# test's own); ASYNC230/240 target production hot paths, not test code.
"tests/**" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are call-in-default by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
