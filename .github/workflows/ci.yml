name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memosng
          POSTGRES_PASSWORD: memosng
          POSTGRES_DB: memosng
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U memosng"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://memosng:memosng@localhost:5433/memosng
      DATABASE_URL_SYNC: postgresql+psycopg2://memosng:memosng@localhost:5433/memosng
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (slow-lane transcode tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Version sources agree (pyproject, package.json, both lockfiles, README)
        # Bare python3, never `uv run`: uv run re-locks uv.lock before executing, which
        # would silently repair the staleness this step exists to catch. Stdlib-only.
        run: python3 scripts/check_release_version.py
      - run: uv run ruff check app/ tests/ scripts/
      - run: uv run pyright app/
      - name: Migrations apply cleanly from an empty database
        run: uv run alembic upgrade head
      - name: Models and migrations agree (no undeclared schema drift)
        run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api-drift:
    # End-to-end type safety (ADR-0009): the generated client must match the live
    # FastAPI schema. Regenerate and fail if anything is stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/gen-openapi.py
      - run: cd frontend && npm ci && npm run gen:api
      - name: Fail on OpenAPI / generated-client drift
        run: |
          if ! git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::OpenAPI schema or generated client is stale. Run 'uv run python scripts/gen-openapi.py' + 'cd frontend && npm run gen:api' and commit."
            exit 1
          fi

  image:
    # The production image is only ever built on main, so a dependency that needs a
    # compiler (python:3.13-slim has none — the blurhash-python scar) or a broken
    # Dockerfile is invisible until after merge. Build it on every PR too: no registry
    # login, no push, no scan — just proof that `docker build` still succeeds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        name: APP_VERSION = <pyproject version>+<short-sha>
        run: |
          v=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "app_version=${v}+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          provenance: false

  release:
    # Build, scan, and publish only from main.
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, api-drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version sources agree (pyproject, package.json, both lockfiles, README)
        # stdlib-only, and this job installs no uv — the runner's python3 is enough.
        # (Also the correct invocation: `uv run` would re-lock uv.lock first.)
        run: python3 scripts/check_release_version.py
      - id: version
        name: APP_VERSION = <pyproject version>+<short-sha>
        run: |
          v=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "app_version=${v}+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fmaass/memos-ng
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        # Build into the local daemon (load), do NOT publish yet — Trivy must gate
        # the push so an image with HIGH/CRITICAL CVEs never becomes public.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          provenance: false
      - name: Trivy scan the local image BEFORE publishing (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/fmaass/memos-ng:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Publish only after the scan passes
        run: docker push --all-tags ghcr.io/fmaass/memos-ng
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/fmaass/memos-ng:latest
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
