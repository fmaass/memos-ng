name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memosng
          POSTGRES_PASSWORD: memosng
          POSTGRES_DB: memosng
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U memosng"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://memosng:memosng@localhost:5433/memosng
      DATABASE_URL_SYNC: postgresql+psycopg2://memosng:memosng@localhost:5433/memosng
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app/ tests/ scripts/
      - run: uv run pyright app/
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api-drift:
    # End-to-end type safety (ADR-0009): the generated client must match the live
    # FastAPI schema. Regenerate and fail if anything is stale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/gen-openapi.py
      - run: cd frontend && npm ci && npm run gen:api
      - name: Fail on OpenAPI / generated-client drift
        run: |
          if ! git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts; then
            echo "::error::OpenAPI schema or generated client is stale. Run 'uv run python scripts/gen-openapi.py' + 'cd frontend && npm run gen:api' and commit."
            exit 1
          fi

  release:
    # Build, scan, and publish only from main.
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, api-drift]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fmaass/memos-ng
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false
      - name: Trivy scan (fail on HIGH/CRITICAL) — digest-pinned (ADR-0003)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/fmaass/memos-ng@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/fmaass/memos-ng@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
