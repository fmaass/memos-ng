services:
  db:
    image: postgres:17
    labels:
      - wud.watch=false
    environment:
      POSTGRES_USER: memosng
      POSTGRES_PASSWORD: memosng
      POSTGRES_DB: memosng
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memosng"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
